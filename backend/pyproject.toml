[project]
name = "urlynk-api"
version = "0.1.0"
description = "UrLynk backend API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the documented pattern.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
